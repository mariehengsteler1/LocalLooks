<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LocalLooks prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--wine:#922B4E;--wine-d:#78213F;--wine-l:#F6E8EE;--sage:#C8CBB6;--sage-l:#E8EADF;--cream:#FDF8EE;--paper:#FFFFFF;--ink:#3A3A3A;--muted:#7A766E;--line:#ECE4D5;--ok:#4D6A38;--okbg:#E8EFDF;--side:#4A4A4A;--side2:#5B5B5B;--blue:#3B7BD9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--sage);font-family:Poppins,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body[data-mode="r"]{background:var(--cream)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
button:disabled{cursor:not-allowed}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--wine);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
small{display:block;color:var(--muted);font-size:12px}
h1,h2,h3,h4{margin:0;font-weight:600;color:var(--ink)}
#app{height:100%}

/* hub */
.hub{min-height:100%;display:grid;place-items:center;padding:32px 20px}
.hubin{max-width:560px;width:100%;text-align:center}
.hubin .logo{width:84px;height:84px;margin:0 auto 18px}
.hubin h1{font-size:40px;font-weight:700;letter-spacing:-.02em;color:#454545}
.hubin p{color:#5d5a52;margin:6px 0 28px}
.hubcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
.hubcard{background:var(--cream);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.hubcard:hover{transform:translateY(-2px)}
.hubcard .ic{width:28px;height:28px;color:var(--wine)}
.hubcard b{font-size:17px}
.hubnote{margin-top:22px;font-size:12px;color:#5d5a52}
@media (max-width:520px){.hubcards{grid-template-columns:1fr}}

/* phone */
.stage{height:100%;display:grid;place-items:center;padding:20px}
.phone{position:relative;width:390px;height:min(820px,calc(100vh - 40px));background:var(--cream);border:10px solid #1C1C1C;border-radius:46px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(40,30,20,.45)}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:118px;height:24px;background:#1C1C1C;border-radius:0 0 16px 16px;z-index:60}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding-bottom:92px;-webkit-overflow-scrolling:touch}
.scroll.nonav{padding-bottom:24px}
.chead{display:flex;align-items:center;justify-content:space-between;padding:36px 18px 8px}
.chead h2{font-size:20px}
.loc{display:flex;align-items:center;gap:8px}
.loc .mk{width:30px;height:30px}
.city{display:flex;align-items:center;gap:2px;font-weight:600;font-size:15px}
.city .ic{width:16px;height:16px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.tabs{display:flex;gap:6px;padding:4px 18px}
.tab{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500}
.tab.on{background:var(--wine);color:#fff}
.sub{margin:8px 18px 12px;font-size:12px;color:var(--muted)}
.feed{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px}
.ocard{display:block;width:100%}
.ophoto{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5}
.art{display:block;width:100%;height:100%}
.vbadge{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);color:var(--ok);font-size:10.5px;font-weight:600;border-radius:999px;padding:3px 8px 3px 5px;display:flex;align-items:center;gap:3px}
.vbadge .ic{width:12px;height:12px}
.othumbs{position:absolute;right:6px;top:30px;display:flex;flex-direction:column;gap:4px}
.thumb{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#F4EFE6;border:1.5px solid #fff}
.thumb svg{width:80%;height:80%}
.thumb.lg{width:52px;height:52px;border-radius:10px;border:0}
.thumb.xl{width:100%;height:auto;aspect-ratio:1;border-radius:12px;border:0}
.ometa{display:flex;justify-content:space-between;gap:6px;font-size:11px;padding:6px 2px 4px;color:var(--ink)}
.ometa span{display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ometa .ic{width:13px;height:13px}
.oshop{color:var(--muted)}
.empty{text-align:center;padding:50px 30px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

.bnav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 6px 8px;z-index:20}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:#8b877f;width:56px}
.nb.on{color:var(--wine);font-weight:600}
.fab{width:52px;height:52px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 14px -4px rgba(146,43,78,.6)}
.fab .ic{width:24px;height:24px}

.hero{position:relative;aspect-ratio:1/1.02;overflow:hidden}
.fbtn{position:absolute;top:36px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.fbtn.l{left:14px}.fbtn.r{right:14px}
.fbtn.on{color:var(--wine)}
.fbtn.on .ic{fill:var(--wine)}
.pad{padding:14px 16px}
.urow{display:flex;align-items:center;gap:10px}
.urow>div{flex:1}
.av{width:36px;height:36px;border-radius:50%;background:var(--sage-l);display:grid;place-items:center;font-weight:600}
.likes{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;color:var(--wine)}
.likes .ic{width:14px;height:14px}
.vrow{display:flex;align-items:center;gap:8px;background:var(--okbg);color:var(--ok);font-size:12px;font-weight:500;border-radius:10px;padding:8px 10px;margin:12px 0}
.vrow .ic{width:16px;height:16px}
.sec{font-size:14px;margin:14px 0 8px}
.irow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px}
.imain{flex:1;display:flex;gap:10px;align-items:center;min-width:0}
.imain>span:last-child{min-width:0}
.imain b{display:block;font-size:13px}
.pr{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-top:2px}
.instore{font-style:normal;font-weight:500;font-size:10px;background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 6px}
.go{width:38px;height:38px;border-radius:50%;background:#3d3d3d;color:#fff;display:grid;place-items:center;flex:none}
.go .ic{width:16px;height:16px}

.search{display:flex;align-items:center;gap:8px;margin:6px 16px 10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;outline:0;background:none;flex:1;padding:11px 0;font-size:13px}
.search .ic{width:17px;height:17px;color:var(--muted)}
.chips{display:flex;gap:6px;padding:0 16px 10px;overflow-x:auto}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:12px}
.chip.on{background:#3d3d3d;color:#fff;border-color:#3d3d3d}
.map{display:block;width:calc(100% - 32px);margin:0 16px;border-radius:14px}
.pin{cursor:pointer}
.mlabel{font-size:9px;fill:#9a958b;font-family:inherit}
.lhead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 16px 8px}
.lhead b{font-size:14px}
.srow{display:flex;align-items:center;gap:10px;width:calc(100% - 32px);margin:0 16px 8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.num{width:24px;height:24px;border-radius:50%;background:var(--wine);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.srow>span:nth-child(2){flex:1;min-width:0}
.srow b{font-size:13px;display:block}
.pair{display:flex;gap:4px}
.pair .thumb{width:34px;height:34px;border:0}

.shophead{padding:40px 16px 16px;background:var(--sage-l)}
.shophead h2{font-size:22px;margin-top:12px}
.backrow{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gitem b{display:block;font-size:11.5px;margin-top:4px;line-height:1.25}
.gitem small{font-size:11px}

.wtop{padding:36px 16px 6px;display:flex;justify-content:space-between;align-items:baseline}
.wtop h2{font-size:20px}
.codecard{display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:8px 16px;background:var(--wine);color:#fff;border-radius:18px;padding:14px}
.codecard .qr{width:96px;height:96px;flex:none;border-radius:8px}
.codecard b{font-size:15px;display:block}
.codecard small{color:rgba(255,255,255,.85);font-size:11.5px;margin:3px 0 6px}
.codecard em{font-style:normal;font-size:11px;font-weight:600;letter-spacing:.06em}
.scanic{width:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.scanic .ic{width:34px;height:34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--wine);color:#fff;font-weight:600;font-size:13px;border-radius:12px;padding:11px 16px}
.btn:hover{background:var(--wine-d)}
.btn.light{background:#fff;color:var(--wine)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D9D2C3}
.btn.ghost:hover{background:#F7F2E8}
.btn.wide{width:100%}
.btn:disabled{background:#CFC8BC;color:#fff}
.btn.ghost:disabled{background:#fff;color:#aaa}
.link{color:var(--wine);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:2px}
.credit{display:flex;justify-content:space-between;gap:10px;margin:8px 16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.big{display:block;font-size:24px;font-weight:700;margin:2px 0}
.credit .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pend{background:var(--sage-l);font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px}
.active{margin:8px 16px;background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.active .ic{width:16px;height:16px}
.jrow{display:flex;gap:10px;align-items:center;width:calc(100% - 32px);margin:0 16px 8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.jrow>span:nth-child(2){flex:1}
.jrow b{display:block;font-size:13px}
.rp{display:inline-block;font-size:10px;font-weight:600;background:var(--okbg);color:var(--ok);border-radius:6px;padding:2px 6px;margin-bottom:2px}
.newtag{font-size:10px;font-weight:600;background:var(--wine);color:#fff;border-radius:6px;padding:2px 6px;margin-left:4px}
.done{font-size:10px;font-weight:600;background:#eee;color:#666;border-radius:6px;padding:2px 6px;margin-left:4px}

.steps{list-style:none;padding:0;margin:10px 0 16px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--sage-l);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.jobhero{display:flex;gap:14px;align-items:center;margin:10px 0}
.jobhero .thumb{width:84px;height:84px;border-radius:14px}
.rewardbig{font-size:22px;font-weight:700;color:var(--ok)}

.fullwine{flex:1;background:var(--wine);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:12px}
.fullwine .qr{width:230px;height:230px;border-radius:16px;cursor:pointer}
.fullwine h2{color:#fff;font-size:20px}
.fullwine p{margin:0;opacity:.88;font-size:13px}
.closex{position:absolute;top:34px;left:14px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;z-index:5}
.closex.dk{background:rgba(255,255,255,.12)}
.wait{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
.scanner{flex:1;background:#222;color:#fff;display:flex;flex-direction:column;align-items:center;padding:38px 20px 20px;position:relative}
.scanner h3{color:#fff;font-size:14px}
.scanner p{font-size:12px;opacity:.8;margin:6px 0 20px;text-align:center}
.vf{position:relative;width:220px;height:220px;display:grid;place-items:center}
.vf .qr{width:150px;height:150px;border-radius:8px}
.vf i{position:absolute;width:34px;height:34px;border:3px solid #fff}
.vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.foundsheet{position:absolute;left:0;right:0;bottom:0;background:var(--cream);color:var(--ink);border-radius:22px 22px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.found{display:flex;gap:10px;align-items:center}
.okc{width:30px;height:30px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;flex:none}
.okc .ic{width:16px;height:16px}
.note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12px}
.center{text-align:center}

.postbar{display:flex;align-items:center;justify-content:center;position:relative;padding:36px 16px 10px;font-weight:600}
.postbar .x{position:absolute;left:12px;bottom:6px;width:34px;height:34px;display:grid;place-items:center}
.ph3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{aspect-ratio:3/4;border-radius:12px;border:1.5px dashed #CFC6B5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted);position:relative;overflow:hidden;background:#fff}
.slot.full{border:0}
.slot .n{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--wine);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
.tagchip{display:inline-flex;align-items:center;gap:6px;border:1px solid #CFC6B5;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:500;background:#fff;margin:0 6px 6px 0}
.tagchip.add{border-style:dashed;color:var(--muted)}
.tagchip .ic{width:13px;height:13px;color:var(--ok)}
textarea.cap{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;min-height:70px;resize:none;font-size:13px}
.jobline{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0}
.jobline>span:nth-child(2){flex:1}
.stick{position:sticky;bottom:0;padding:12px 16px 18px;background:linear-gradient(transparent,var(--cream) 30%)}
.hint{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px}
.lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin:14px 0 8px}
.lbl small{color:var(--ok);font-weight:600}

.sheetwrap{position:absolute;inset:0;background:rgba(30,25,20,.38);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--cream);border-radius:22px 22px 0 0;padding:10px 18px 26px;animation:up .22s ease-out;max-height:85%;overflow:auto}
.grab{width:40px;height:4px;border-radius:2px;background:#D6CDBC;margin:0 auto 12px}
.sheet h3{font-size:17px}
.sheet .row{display:flex;gap:8px;margin-top:14px}
.sheet .row .btn{flex:1}
.amts{display:flex;gap:8px;margin:12px 0}
.amt{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:600;text-align:center}
.amt.on{border-color:var(--wine);background:var(--wine-l);color:var(--wine)}
.redeemqr{display:flex;flex-direction:column;align-items:center;gap:6px;margin:12px 0}
.redeemqr .qr{width:170px;height:170px}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2f2f2f;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:min(90vw,420px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* retailer */
.rapp{display:grid;grid-template-columns:220px 1fr;height:100%;background:var(--cream)}
.side{background:var(--side);color:#eee;padding:18px 12px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:#fff;padding:0 6px}
.brand .mk{width:28px;height:28px}
.shopcard{display:flex;gap:10px;align-items:center;background:var(--side2);border-radius:12px;padding:9px}
.shopcard b{display:block;font-size:12.5px;color:#fff}
.shopcard small{color:#cfcfcf;font-size:11px}
.sq{width:30px;height:30px;border-radius:8px;background:var(--sage);color:#3a3a3a;font-weight:700;font-size:11px;display:grid;place-items:center;flex:none}
.rnav{display:flex;flex-direction:column;gap:2px}
.rn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13px;color:#ddd}
.rn .ic{width:17px;height:17px}
.rn.on{background:var(--side2);color:#fff;font-weight:600}
.rn:hover{background:#555}
.planbox{margin-top:auto;border:1px solid #666;border-radius:12px;padding:10px;text-align:left}
.planbox small{color:#bbb;font-size:11px}
.planbox b{display:block;color:#fff;font-size:13px}
.rmain{overflow:auto;padding:28px 34px 70px}
.rmain h1{font-size:22px}
.lead{color:var(--muted);margin:2px 0 18px;font-size:13px}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.stabs{display:flex;gap:6px;margin-bottom:18px}
.stab{padding:7px 14px;border-radius:999px;font-size:12.5px;background:#fff;border:1px solid var(--line)}
.stab.on{background:#3d3d3d;color:#fff;border-color:#3d3d3d}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,330px));gap:16px}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column}
.plan.cur{border-color:var(--wine)}
.plan .ph{display:flex;justify-content:space-between;align-items:center}
.plan h3{font-size:16px}
.plan>p{font-size:12px;color:var(--muted);margin:4px 0 12px;min-height:34px}
.tag{font-size:10.5px;font-weight:600;background:var(--wine);color:#fff;border-radius:999px;padding:3px 9px}
.price{font-size:30px;font-weight:700;margin-bottom:10px}
.price small{display:inline;font-size:13px;font-weight:400}
.plan ul{list-style:none;padding:0;margin:0 0 16px;flex:1}
.plan li{display:flex;gap:8px;padding:6px 0;border-top:1px solid #F3EEE4}
.plan li .ic{width:16px;height:16px;color:var(--wine);margin-top:2px}
.plan li.no .ic{color:#bbb}
.plan li small{font-size:11px}
.plan li b{font-size:12.5px;font-weight:600;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.stat b{font-size:22px;display:block}

tab:function(a){var c=S.c;c.hist=[];c.scr=a;c.sheet=null;render()},
ftab:function(a){S.c.tab=a;render()},
go:function(a){cgo(a)},back:cback,
openOutfit:function(a){S.c.outfit=a;cgo("outfit")},
openShop:function(a){S.c.shop=a;cgo("shop")},
openJob:function(a){S.c.job=a;cgo("job")},
directions:function(a){S.c.sheet={type:"dir",shop:a};render()},
startDir:function(){S.c.sheet=null;render();toast("Your maps app would open with walking directions here.")},
closeSheet:function(){S.c.sheet=null;render()},
closeSheetBg:function(a,el,e){if(e.target===el){S.c.sheet=null;render()}},
save:function(a){var s=S.c.saved,i=s.indexOf(a);if(i>-1)s.splice(i,1);else s.push(a);render();toast(i>-1?"Removed from Saved":"Saved to your looks")},
area:function(a){S.c.area=a;render()},
fab:function(){cgo(S.variant.c==="A"?"code":"scanner")},
takeJob:function(a){S.c.activeJob=a;render();toast("Job taken. You find it in your wallet.")},
codeTap:function(){var c=S.c;c.taps++;clearTimeout(A.ct);A.ct=setTimeout(function(){c.taps=0},800);if(c.taps>=3){c.taps=0;simScan()}},
confirmVisit:function(){verified("B");S.c.hist=["wallet"];S.c.scr="newpost";render()},
later:function(){S.c.hist=[];S.c.scr="wallet";render()},
addPhoto:function(){var c=S.c;c.post.photos++;render()},
tagPiece:function(){var t=S.c.post.tags;var opts=["trousers","nb550","knit"].filter(function(x){return t.indexOf(x)<0});if(opts.length)t.push(opts[0]);render()},
post:function(){var c=S.c,j=CJ[c.activeJob||"j1"];c.pending+=j.reward;c.pendPosts++;if(c.done.indexOf(j.id)<0)c.done.push(j.id);c.activeJob=null;c.hist=[];c.scr="wallet";render();toast("Posted. "+eur(j.reward)+" credit is pending until the shop approves.")},
redeem:function(){S.c.sheet={type:"redeem",amt:null,code:false};render()},
redAmt:function(a){S.c.sheet.amt=+a;render()},
redCreate:function(){S.c.sheet.code=true;render()},
redDone:function(){var c=S.c;c.credit=Math.round((c.credit-c.sheet.amt)*100)/100;c.sheet=null;render();toast("Redeemed. The shop has deducted it from your bill.")},
/* retailer */
rgo:function(a){var r=S.r;r.scr=a;r.err="";if(a==="till"&&r.till!=="sel")r.till="scan";render()},
pickPlan:function(a){S.r.modal={type:"plan",k:a};render()},
confirmPlan:function(){var r=S.r;r.plan=r.modal.k;r.modal=null;render();toast("You are on "+PLANS[r.plan].name+" now.")},
closeModal:function(){S.r.modal=null;render()},
tillStep:function(a){var t=S.r.tillA;if(a==="sent"){t.sent=true;toast("Download link sent to studio@ella.nl")}else{t.linked=true;toast("Counter tablet linked")}render()},
tillScan:function(){S.r.till="sel";S.r.tillSel={bomber:true};render()},
tillItem:function(a){S.r.tillSel[a]=!S.r.tillSel[a];render()},
tillConfirm:function(){S.r.till="ok";S.r.tillA.tested=true;render()},
tillNot:function(){S.r.till="no";render()},
tillNext:function(){S.r.till="scan";render()},
qrFmt:function(a){S.r.fmt=a;render()},
print:function(){S.r.printed=true;render();toast("Sent to your printer")},
pdf:function(){toast("The PDF would download here.")},
stock:function(a){var s=S.r.stock;s[a]=s[a]===false;render()},
fphoto:function(){S.r.form.photo=true;render()},
size:function(a){var z=S.r.form.sizes,i=z.indexOf(a);if(i>-1)z.splice(i,1);else z.push(a);render()},
fjob:function(){S.r.form.job=!S.r.form.job;render()},
fopt:function(a){var p=a.split(":");S.r.form[p[0]]=+p[1];render()},
draft:function(){toast("Draft saved")},
publish:function(){var r=S.r,f=r.form;if(!f.name.trim()||!String(f.price).trim()){r.err="Add a product name and a price to publish.";render();return}
var id="p"+Date.now();var typ={"Jackets and coats":"jacket","Tops":"tshirt","Knitwear":"sweater","Trousers and jeans":"trousers","Dresses":"dress","Shoes":"sneaker","Bags and accessories":"bag"}[f.cat]||"jacket";
ITEMS[id]={name:f.name.trim(),shop:"ella",price:parseFloat(String(f.price).replace(",","."))||0,type:typ,col:"#6B5A4C",views:"0"};r.products.unshift(id);
if(f.job)r.jobs.unshift({item:id,reward:f.reward,photos:f.photos,status:"Open",sub:"no submissions yet"});
var msg=f.job?"Published, and the content job is live":"Published to the Maastricht feed";r.form=blankForm();r.err="";r.scr=f.job?"jobs":"products";render();toast(msg)},
newJob:function(){var r=S.r;r.modal={type:"job",item:r.products[0],reward:5,photos:3};render()},
mopt:function(a){var p=a.split(":");S.r.modal[p[0]]=+p[1];render()},
fundJob:function(){var r=S.r,m=r.modal;r.jobs.unshift({item:m.item,reward:m.reward,photos:m.photos,status:"Open",sub:"no submissions yet"});r.modal=null;render();toast("Content job published")},
review:function(a){var p=a.split(":");S.r.reviews[+p[0]].st=p[1];render();toast(p[1]==="Approved"?"Approved. The creator gets their credit.":"Declined. The creator is told why.")}
};
function simScan(){if(S.mode!=="c"||S.c.scr!=="code")return;verified("A");S.c.hist=["wallet"];S.c.scr="verified";render()}

document.addEventListener("click",function(e){var el=e.target.closest("[data-act]");if(!el||!$("#app").contains(el))return;var act=el.dataset.act;if(!A[act])return;
if(el.tagName==="INPUT"&&el.type==="checkbox"){A[act](el.dataset.arg,el,e);return}
if(act!=="closeSheetBg")e.preventDefault();A[act](el.dataset.arg,el,e)});
document.addEventListener("input",function(e){var m=e.target.dataset.model;if(!m)return;var v=e.target.value;
if(m==="q"){S.c.q=v;$("#shopres").innerHTML=shopResults();return}
if(m==="caption"){S.c.post.caption=v;return}
if(m.indexOf("form.")===0){S.r.form[m.slice(5)]=v;var pv=$("#pv");if(pv)pv.innerHTML=preview();return}
if(m==="modal.item"){S.r.modal.item=v;return}});

/* ---------- moderator ---------- */
var M=ls("ll_cur")||{pid:"P1",log:[],stuck:[],pref:null};M.open=false;M.cur=null;M.show=null;M.hints=0;M.t0=0;M.sev=2;
function saveCur(){ls("ll_cur",{pid:M.pid,log:M.log,stuck:M.stuck,pref:M.pref})}
function jr(){return S.mode==="r"?"r":"c"}
function taskText(t){var v=S.variant[jr()];return (v==="B"&&t.b)?t.b:t.a}
function fmt(s){s=Math.floor(s);return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function suggest(){var s=(Date.now()-M.t0)/1000;if(M.hints>=2)return "Fail";if(M.hints===1||s>120)return "Partial";return "Complete"}
function renderTask(){var b=$("#taskb");if(!M.show||S.mode==="hub"){b.innerHTML="";return}var t=TASKS[jr()].filter(function(x){return x.id===M.show})[0];if(!t){b.innerHTML="";return}
b.innerHTML='<div class="taskcard"><span><small>Your task</small><b>'+esc(taskText(t))+'</b></span><button data-mact="show" data-arg="'+t.id+'">Hide</button></div>'}
function summary(){var ss=ls("ll_sessions")||[];var agg={},pref={c:{A:0,B:0},r:{A:0,B:0}},stuck=0;
ss.forEach(function(s){s.log.forEach(function(l){var k=s.journey+" "+l.task+" ("+l.variant+")";agg[k]=agg[k]||{C:0,P:0,F:0};agg[k][l.outcome[0]]++});if(s.pref)pref[s.journey][s.pref]++;stuck+=s.stuck.length});
var rows=Object.keys(agg).sort().map(function(k){var a=agg[k],n=a.C+a.P+a.F;return '<tr><td>'+k.replace(/^c /,"Shopper ").replace(/^r /,"Shop ")+'</td><td class="n">'+a.C+'/'+n+'</td><td class="n">'+a.P+'</td><td class="n">'+a.F+'</td></tr>'}).join("");
var csv=["participant,journey,record,task_or_screen,variant,outcome_or_severity,seconds,hints,note"];ss.forEach(function(s){s.log.forEach(function(l){csv.push([s.pid,s.journey,"task",l.task,l.variant,l.outcome,l.secs,l.hints,""].join(","))});s.stuck.forEach(function(x){csv.push([s.pid,s.journey,"stuck",'"'+x.screen+'"',x.variant,x.sev,x.secs||"","",'"'+x.note.replace(/"/g,"'")+'"'].join(","))});if(s.pref)csv.push([s.pid,s.journey,"preference","",s.pref,"","","",""].join(","))});
return '<h4>All saved sessions ('+ss.length+')</h4>'+(ss.length?'<table class="msum"><thead><tr><th>Task</th><th class="n">Unaided</th><th class="n">Partial</th><th class="n">Fail</th></tr></thead><tbody>'+rows+'</tbody></table><p class="vdesc">Preference A vs B. Shoppers: '+pref.c.A+' A, '+pref.c.B+' B. Shops: '+pref.r.A+' A, '+pref.r.B+' B. Stuck points logged: '+stuck+'.</p><p class="vdesc">Copy this into your sheet:</p><textarea readonly onfocus="this.select()">'+esc(csv.join("\n"))+'</textarea><button class="mb" data-mact="clear" style="margin-top:6px">Delete all sessions</button>':'<p class="vdesc">Nothing saved yet.</p>')}
function renderMod(){var el=$("#mod");if(!M.open){el.innerHTML='<button class="modtoggle" data-mact="open" aria-label="Open moderator panel" title="Moderator panel (Shift+M)">M</button>';return}
var j=jr(),inApp=S.mode!=="hub",v=S.variant[j];
var vd=j==="c"?{A:"Shopper shows their code at the till",B:"Shopper scans the code on the counter"}:{A:"Staff scan codes on a till device",B:"Printed counter QR, no staff step"};
var tasks=inApp?TASKS[j].map(function(t){return '<div class="mt '+(M.cur===t.id?"on":"")+'"><b>'+t.id+'</b> <span class="code">'+t.code+'</span><p>'+esc(taskText(t))+'</p><div class="mrow"><button class="mb" data-mact="show" data-arg="'+t.id+'">'+(M.show===t.id?"Hide card":"Show card")+'</button><button class="mb pri" data-mact="start" data-arg="'+t.id+'">'+(M.cur===t.id?"Restart":"Start")+'</button></div></div>'}).join(""):"";
var run=M.cur?'<div class="run"><div class="mrow" style="justify-content:space-between"><span>'+M.cur+' running, variant '+v+'</span><span class="t" id="mtimer">0:00</span></div><div class="mrow" style="margin:6px 0">Hints: <b>'+M.hints+'</b><button class="mb" data-mact="hint">+ Hint</button><span class="vdesc" id="msug"></span></div><div class="mrow"><button class="mb ok" data-mact="out" data-arg="Complete">Complete</button><button class="mb pa" data-mact="out" data-arg="Partial">Partial</button><button class="mb fa" data-mact="out" data-arg="Fail">Fail</button></div></div>':"";
var log=M.log.filter(function(l){return l.journey===j}).map(function(l){return '<div>'+l.task+' ('+l.variant+'): '+l.outcome+', '+l.secs+' s, '+l.hints+' hint'+(l.hints===1?"":"s")+'</div>'}).join("")+M.stuck.filter(function(s){return s.journey===j}).map(function(s){return '<div>Stuck, '+esc(s.screen)+', severity '+s.sev+': '+esc(s.note)+'</div>'}).join("");
el.innerHTML='<aside class="modp" aria-label="Moderator panel"><header><b>Moderator</b><button class="mb" data-mact="close">Close</button></header>'+
'<label>Participant ID <input type="text" data-mfield="pid" value="'+esc(M.pid)+'"></label>'+
'<h4>App</h4><div class="mrow"><button class="mb '+(S.mode==="c"?"on":"")+'" data-mact="mode" data-arg="c">Shopper</button><button class="mb '+(S.mode==="r"?"on":"")+'" data-mact="mode" data-arg="r">Shop</button><button class="mb '+(S.mode==="hub"?"on":"")+'" data-mact="mode" data-arg="hub">Start page</button></div>'+
(inApp?'<h4>Verification variant</h4><div class="mrow"><button class="mb '+(v==="A"?"on":"")+'" data-mact="var" data-arg="A">A</button><button class="mb '+(v==="B"?"on":"")+'" data-mact="var" data-arg="B">B</button></div><p class="vdesc">'+v+': '+vd[v]+'</p><div class="mscr">Screen: <b>'+CODES[curScr()]+'</b></div>'+(j==="c"&&v==="A"&&S.c.scr==="code"?'<button class="mb pri" data-mact="sim" style="margin-top:8px;width:100%">Simulate shop scan</button><p class="vdesc">Or triple-tap the QR code on the phone.</p>':"")+'<h4>Tasks</h4>'+tasks+run+
'<h4>Log a stuck point on this screen</h4><input type="text" id="stucknote" placeholder="What happened, in their words"><div class="mrow" style="margin-top:6px">Severity '+[1,2,3].map(function(n){return '<button class="mb '+(M.sev===n?"on":"")+'" data-mact="sev" data-arg="'+n+'">'+n+'</button>'}).join("")+'<button class="mb pri" data-mact="stuck">Log</button></div>'+
'<h4>Forced choice: which way of verifying did they prefer?</h4><div class="mrow"><button class="mb '+(M.pref===("A"+j)?"on":"")+'" data-mact="pref" data-arg="A">A</button><button class="mb '+(M.pref===("B"+j)?"on":"")+'" data-mact="pref" data-arg="B">B</button></div>'+
'<h4>This session</h4><div class="mlog">'+(log||'<p class="vdesc">No records yet.</p>')+'</div><div class="mrow" style="margin-top:8px"><button class="mb pri" data-mact="saveS">Save session and reset app</button><button class="mb" data-mact="reset">Reset app only</button></div>':"")+
summary()+'</aside>';
tick()}
function tick(){var t=$("#mtimer"),s=$("#msug");if(t&&M.cur){t.textContent=fmt((Date.now()-M.t0)/1000);if(s)s.textContent="Suggested: "+suggest()}}
setInterval(tick,500);
var MA={
open:function(){M.open=true;renderMod()},close:function(){M.open=false;renderMod()},
mode:function(a){S.mode=a;render()},
"var":function(a){S.variant[jr()]=a;render()},
sim:simScan,
show:function(a){M.show=M.show===a?null:a;renderTask();if(M.open)renderMod()},
start:function(a){M.cur=a;M.t0=Date.now();M.hints=0;renderMod()},
hint:function(){M.hints++;renderMod()},
out:function(a){M.log.push({journey:jr(),task:M.cur,variant:S.variant[jr()],outcome:a,secs:Math.round((Date.now()-M.t0)/1000),hints:M.hints});M.cur=null;M.show=null;saveCur();renderTask();renderMod()},
sev:function(a){M.sev=+a;var n=$("#stucknote").value;renderMod();$("#stucknote").value=n},
stuck:function(){var n=$("#stucknote").value.trim();if(!n){toast("Write a short note first");return}M.stuck.push({journey:jr(),screen:CODES[curScr()],variant:S.variant[jr()],sev:M.sev,note:n,secs:M.cur?Math.round((Date.now()-M.t0)/1000):""});saveCur();renderMod();toast("Stuck point logged")},
pref:function(a){M.pref=a+jr();saveCur();renderMod()},
saveS:function(){var ss=ls("ll_sessions")||[];["c","r"].forEach(function(j){var lg=M.log.filter(function(l){return l.journey===j}),st=M.stuck.filter(function(s){return s.journey===j});var pf=M.pref&&M.pref.slice(1)===j?M.pref[0]:null;if(lg.length||st.length||pf)ss.push({pid:M.pid,journey:j,log:lg,stuck:st,pref:pf,at:new Date().toISOString()})});ls("ll_sessions",ss);
var num=parseInt((M.pid.match(/\d+/)||["0"])[0],10);M.pid="P"+(num+1);M.log=[];M.stuck=[];M.pref=null;M.cur=null;M.show=null;saveCur();var m=S.mode;fresh();S.mode=m;render();renderMod();toast("Session saved. Ready for "+M.pid)},
reset:function(){var m=S.mode;fresh();S.mode=m;render();toast("App reset")},
clear:function(){if(confirm("Delete all saved sessions on this device?")){ls("ll_sessions",[]);renderMod()}}
};
document.addEventListener("click",function(e){var el=e.target.closest("[data-mact]");if(!el)return;e.preventDefault();var f=MA[el.dataset.mact];if(f)f(el.dataset.arg)});
document.addEventListener("input",function(e){if(e.target.dataset.mfield==="pid"){M.pid=e.target.value;saveCur()}});
document.addEventListener("keydown",function(e){if(e.shiftKey&&(e.key==="M"||e.key==="m")&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){M.open=!M.open;renderMod()}});

render();renderMod();
})();
</script>
</body>
</html>
